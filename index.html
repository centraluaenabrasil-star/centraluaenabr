<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Uaena Brasil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #9b59b6;
        }
        .meta {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        .progresso {
            font-size: 18px;
            color: #555;
        }
        .barra {
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 2px;
            margin: 20px 0;
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 CENTRAL UAENA BRASIL</h1>
        <div class="meta">
            Meta: 50 streams
        </div>
        <div class="progresso">
            Progresso atual: 3 (6%)
        </div>
        <div class="barra">
            █░░░░░░░░░░░░░░░░░░░ 6%
        </div>
        <div class="progresso">
            📊 Atualizado em: <span id="data"></span>
        </div>
        <footer>
            💜 Vamos juntos apoiar a IU!
        </footer>
    </div>
    <script>
        document.getElementById('data').innerText = new Date().toLocaleDateString('pt-BR');
    </script>
</body>
</html>
